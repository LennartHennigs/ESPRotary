; PlatformIO Project Configuration File
;
; Build options: build flags, source filter
; Upload options: custom upload port, speed and extra flags
; Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Hardware environment (upload to a real board)
[env:Wemos_D1_Mini]
platform = espressif8266
board = d1_mini
framework = arduino
upload_protocol = esptool

; --------------------------------------------------------------------------
; Native test environments using EpoxyDuino + AUnit (no hardware required)
; Run with: pio test -e test_core   /   pio test -e test_context
; --------------------------------------------------------------------------

[env:test_core]
platform = native
lib_deps =
    https://github.com/bxparks/EpoxyDuino.git#v1.6.0
    bxparks/AUnit@^1.7.1
lib_ldf_mode = deep+
lib_compat_mode = off
lib_ignore = Unity
build_flags =
    -std=c++11
    -Wall
    -Wno-deprecated-declarations
    -DEPOXY_DUINO
    -DEPOXY_CORE_ESP8266
    -DARDUINO_ESP8266
    -DESP8266
build_src_filter = +<*> -<examples/>
test_build_src = true
test_filter = test_core

[env:test_context]
platform = native
lib_deps =
    https://github.com/bxparks/EpoxyDuino.git#v1.6.0
    bxparks/AUnit@^1.7.1
